services:
  - type: web
    name: codexai-server
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    disk:
      name: codexai-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CHROMA_PERSIST_PATH
        value: /app/data/chroma_db
      - key: REPOS_DIR
        value: /app/data/repos
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
