version: '3.8'

services:
  server:
    build:
      context: ./server
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    environment:
      - CHROMA_URL=http://chroma:8000
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongodb:27017/codexai
    volumes:
      - ./server:/app
      - chroma_data:/app/chroma_db
      - repos_data:/app/repos
    depends_on:
      - redis
      - chroma
      - mongodb

  client:
    build:
      context: ./client
    ports:
      - "3000:80"
    depends_on:
      - server

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  redis_data:
  chroma_data:
  repos_data:
  mongodb_data:

