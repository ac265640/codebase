version: '3.8'

services:
  server:
    build:
      context: ./server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/codexai
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=development_secret_key
      - JWT_REFRESH_SECRET=development_refresh_secret
      - CLIENT_URL=http://localhost:8080
      - CHROMA_PERSIST_PATH=/app/chroma_db
      - REPOS_DIR=/app/repos
    volumes:
      - chroma_data:/app/chroma_db
      - repos_data:/app/repos
    depends_on:
      - mongo
      - redis

  client:
    build:
      context: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
  chroma_data:
  repos_data:
